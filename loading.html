<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chargement…</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
  #stage { position: absolute; inset: 0; }
  .slide {
    position: absolute; inset: 0;
    background-size: cover; background-position: center; background-repeat: no-repeat;
    opacity: 0; transition: opacity 1s ease-in-out;
  }
  .slide.active { opacity: 1; }
  #hint {
    position: absolute; bottom: 18px; left: 0; right: 0; text-align: center;
    color: #d9b26a; font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
    text-shadow: 0 1px 4px #000; opacity: .85;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="hint">Chargement…</div>

<script>
  /* ============ CONFIG — édite uniquement ces 2 lignes ============ */
  var IMAGES  = ["screen1.png"]; //"screen2.png", "screen3.png" tes .png (même dossier que ce fichier)
  var SECONDS = 6;                                             // durée d'affichage par image
  /* =============================================================== */

  var stage = document.getElementById("stage");

  // crée un calque par image + précharge
  var slides = IMAGES.map(function (src, i) {
    var d = document.createElement("div");
    d.className = "slide" + (i === 0 ? " active" : "");
    d.style.backgroundImage = "url('" + src + "')";
    stage.appendChild(d);
    var pre = new Image(); pre.src = src; // préchargement
    return d;
  });

  // rotation
  var idx = 0;
  if (slides.length > 1) {
    setInterval(function () {
      slides[idx].classList.remove("active");
      idx = (idx + 1) % slides.length;
      slides[idx].classList.add("active");
    }, SECONDS * 1000);
  }

  /* GMod appelle ces fonctions automatiquement (facultatif).
     GameDetails remplace le texte du bas par le nom du serveur ; le reste est ignoré. */
  function GameDetails(servername) { if (servername) { document.getElementById("hint").textContent = servername; } }
  function SetFilesTotal(total) {}
  function SetFilesNeeded(needed) {}
  function DownloadingFile(fileName) {}
  function SetStatusChanged(status) {}
</script>
</body>
</html>
